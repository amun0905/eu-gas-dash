          - {name: Milan, lat: 45.46, lon: 9.19, pop: 4.3}
          - {name: Rome, lat: 41.90, lon: 12.50, pop: 4.3}
          - {name: Naples, lat: 40.85, lon: 14.27, pop: 3.1}
          - {name: Turin, lat: 45.07, lon: 7.69, pop: 2.2}
          - {name: Venice/Padua, lat: 45.44, lon: 12.00, pop: 1.5}
        ES:
          - {name: Madrid, lat: 40.42, lon: -3.70, pop: 6.8}
          - {name: Barcelona, lat: 41.39, lon: 2.17, pop: 5.6}
          - {name: Valencia, lat: 39.47, lon: -0.38, pop: 1.9}
          - {name: Seville, lat: 37.39, lon: -5.98, pop: 1.5}
    columns:
      day: datetime
      country: str
      tmean: float
      hres: float
      ens_mean: float
      ens_p10: float
      ens_p90: float
      is_forecast: int
      fetched_at: str

  # Every ECMWF run as it arrives, never overwritten, for the "vs previous run" view on the Weather tab.
  # Same countries and cities as weather_country (YAML anchor), and the same forecast download.
  weather_runs:
    description: ECMWF forecast by country for each model run (HRES and ENS), for run-to-run changes
    source: ecmwf
    query: window
    time_column: run
    keys: [run, model, day, country]
    chunk_days: 31
    lookback_days: 1
    start: "2026-11-01"
    max_staleness_hours: 30        # newest run older than this -> something is wrong upstream
    options:
      mode: runs
      countries: *wx_countries
    columns:
      run: datetime
      model: str
      day: datetime
      country: str
      t: float
      p10: float
      p90: float
