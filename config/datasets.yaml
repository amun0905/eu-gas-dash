          - {name: Eindhoven, lat: 51.44, lon: 5.47, pop: 0.8}
          - {name: Groningen, lat: 53.22, lon: 6.57, pop: 0.4}
        DE:
          - {name: Ruhr (Essen), lat: 51.46, lon: 7.01, pop: 5.0}
          - {name: Cologne/Duesseldorf, lat: 51.10, lon: 6.90, pop: 5.0}
          - {name: Berlin, lat: 52.52, lon: 13.41, pop: 4.7}
          - {name: Hamburg, lat: 53.55, lon: 9.99, pop: 3.0}
          - {name: Munich, lat: 48.14, lon: 11.58, pop: 2.9}
          - {name: Frankfurt, lat: 50.11, lon: 8.68, pop: 2.6}
        DK:
          - {name: Copenhagen, lat: 55.68, lon: 12.57, pop: 2.1}
          - {name: Aarhus, lat: 56.16, lon: 10.20, pop: 0.4}
          - {name: Aalborg, lat: 57.05, lon: 9.92, pop: 0.2}
        PL:
          - {name: Warsaw, lat: 52.23, lon: 21.01, pop: 3.1}
          - {name: Katowice, lat: 50.26, lon: 19.02, pop: 2.7}
          - {name: Krakow, lat: 50.06, lon: 19.94, pop: 1.5}
          - {name: Gdansk, lat: 54.35, lon: 18.65, pop: 1.1}
        CZ:
          - {name: Prague, lat: 50.08, lon: 14.44, pop: 2.7}
          - {name: Ostrava, lat: 49.82, lon: 18.26, pop: 1.1}
          - {name: Brno, lat: 49.20, lon: 16.61, pop: 0.7}
        AT:
          - {name: Vienna, lat: 48.21, lon: 16.37, pop: 2.9}
          - {name: Graz, lat: 47.07, lon: 15.44, pop: 0.6}
