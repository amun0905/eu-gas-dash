name: backfill

# Manual: Actions tab -> backfill -> Run workflow. Safe to re-run; finished months are skipped.
# GIE allows 60 calls/minute, so the storage + LNG history takes around an hour the first time.
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Space-separated dataset names"
        required: true
        default: "entsog_flows gb_nts weather_temp entsog_umm entsog_cmp_auctions agsi_storage alsi_lng gie_umm"
      start:
        description: "Start date (YYYY-MM-DD); blank = each dataset's configured start"
        required: false
      end:
        description: "End date (YYYY-MM-DD); blank = now"
        required: false

concurrency:
  group: data-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GASDASH_STORE: ${{ vars.GASDASH_STORE }}
      GASDASH_S3_ENDPOINT: ${{ secrets.GASDASH_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[s3]"
      - name: Backfill
        env:   # inputs passed via env, never interpolated into the script
          IN_DATASETS: ${{ github.event.inputs.datasets }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
        run: |
          ARGS=()
          [ -n "$IN_START" ] && ARGS+=(--start "$IN_START")
          [ -n "$IN_END" ] && ARGS+=(--end "$IN_END")
          # shellcheck disable=SC2086
          gasdash backfill $IN_DATASETS "${ARGS[@]}"
      - name: Export website data
        if: always()
        run: gasdash export
