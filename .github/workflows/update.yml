name: update-data

# Runs in GitHub's cloud every 2 hours; no machine of yours needs to be on.
# Minute 17 avoids the :00 rush, when GitHub delays scheduled jobs most.
# GIE publishes storage/LNG once a day (~19:30 CET, second run 23:00), ENTSOG flows and
# nominations through the day, National Gas D+1 in the morning.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Space-separated dataset names (blank = all)"
        required: false
        default: ""

# Never let two runs write to the store at the same time.
concurrency:
  group: data-store
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only used by the keep-alive step

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GASDASH_STORE: ${{ vars.GASDASH_STORE }}                 # e.g. s3://gb-power-data/eu-gas
      GASDASH_S3_ENDPOINT: ${{ secrets.GASDASH_S3_ENDPOINT }}  # https://<account>.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GIE_API_KEY: ${{ secrets.GIE_API_KEY }}                  # optional: GIE datasets are skipped without it
    steps:
      - uses: actions/checkout@v5

      - name: Check storage is configured
        run: |
          if [ -z "$GASDASH_STORE" ]; then
            echo "::error::Set the repository variable GASDASH_STORE (e.g. s3://gb-power-data/eu-gas). Without it, data would be written to the throw-away runner disk."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ".[s3]"

      - name: Update datasets
        env:
          IN_DATASETS: ${{ github.event.inputs.datasets }}
        # shellcheck disable=SC2086
        run: gasdash update $IN_DATASETS

      - name: Export website data
        if: always()
        run: gasdash export

      - name: Freshness check
        if: always()
        run: gasdash status --fail-on-stale

      # GitHub silently disables cron workflows after 60 days without repo activity.
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
